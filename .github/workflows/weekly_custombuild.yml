name: Weekly Patched OpenCode Build

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream branch/ref/tag to build"
        required: true
        default: "dev"

  schedule:
    # Every Monday 03:00 UTC
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        baseline: [false, true]

    env:
      UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'dev' }}

    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate patches exist
        shell: pwsh
        run: |
          if (!(Test-Path patches)) {
            throw "Missing ./patches directory"
          }

          $patches = Get-ChildItem patches\*.patch -ErrorAction SilentlyContinue | Sort-Object Name
          if ($patches.Count -eq 0) {
            throw "No .patch files found in ./patches"
          }

          Write-Host "Patch files:"
          $patches | ForEach-Object { Write-Host $_.FullName }

      - name: Clone upstream OpenCode
        shell: pwsh
        run: |
          git clone --depth 1 --branch "$env:UPSTREAM_REF" https://github.com/anomalyco/opencode.git opencode-src

          cd opencode-src
          git log -1 --oneline

      - name: Apply patches
        shell: pwsh
        run: |
          cd opencode-src

          git config user.name "patched-build-bot"
          git config user.email "patched-build-bot@example.local"

          $patches = Get-ChildItem ..\patches\*.patch | Sort-Object Name

          foreach ($patch in $patches) {
            Write-Host "Applying patch: $($patch.Name)"
            git am --3way "$($patch.FullName)"

            if ($LASTEXITCODE -ne 0) {
              Write-Host "Patch failed. Git status:"
              git status
              throw "Patch apply failed: $($patch.Name)"
            }
          }

          Write-Host "Patched commit stack:"
          git log --oneline -10

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          cd opencode-src
          bun install

      - name: Build patched OpenCode
        shell: pwsh
        run: |
          cd opencode-src

          if ("${{ matrix.baseline }}" -eq "true") {
            bun run --cwd packages/opencode build --single --baseline
          } else {
            bun run --cwd packages/opencode build --single
          }

      - name: Locate built binary
        id: locate
        shell: pwsh
        run: |
          cd opencode-src

          $dist = "packages\opencode\dist"

          Write-Host "Dist tree:"
          Get-ChildItem $dist -Recurse | Select-Object FullName

          $exe = Get-ChildItem $dist -Recurse -Filter "opencode.exe" | Select-Object -First 1

          if (!$exe) {
            $raw = Get-ChildItem $dist -Recurse -Filter "opencode" | Select-Object -First 1
            if (!$raw) {
              throw "Could not find opencode binary"
            }
            $exe = $raw
          }

          Write-Host "Found binary: $($exe.FullName)"
          echo "binary=$($exe.FullName)" >> $env:GITHUB_OUTPUT

          & $exe.FullName --version

      - name: Package artifact
        shell: pwsh
        run: |
          $suffix = if ("${{ matrix.baseline }}" -eq "true") { "baseline" } else { "normal" }
          $name = "opencode-windows-x64-custom-$suffix"

          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item "${{ steps.locate.outputs.binary }}" "artifact\opencode.exe" -Force

          Push-Location artifact
          Compress-Archive -Path opencode.exe -DestinationPath "..\$name.zip" -Force
          Pop-Location

          Get-FileHash "$name.zip" -Algorithm SHA256 | Tee-Object -FilePath "$name.sha256.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-x64-custom-${{ matrix.baseline && 'baseline' || 'normal' }}
          path: |
            *.zip
            *.sha256.txt