name: Patched OpenCode WeeklyAuto Build

on:
  push:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream branch/ref/tag"
        required: true
        default: "production"
      cleanup_only:
        description: "Clean old Actions artifacts only; do not build or delete Releases"
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write
  actions: write

concurrency:
  group: patched-opencode-build
  cancel-in-progress: false

jobs:
  cleanup_artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Test storage retention safeguards
        run: node --test .github/scripts/cleanup-storage.test.cjs
      - name: Clean old Actions artifacts (independent of build success)
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { cleanupArtifacts } = require('./.github/scripts/cleanup-storage.cjs');
            await cleanupArtifacts({ github, context, core });

  build:
    needs: cleanup_artifacts
    if: ${{ !cancelled() && inputs.cleanup_only != true }}
    runs-on: ubuntu-latest

    env:
      UPSTREAM_REPO: https://github.com/anomalyco/opencode.git
      UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'production' }}
      STATE_BRANCH: dev
      STATE_FILE_DIR: .github/opencode-build-state
      # Disable husky so the .husky/pre-push hook (bun turbo typecheck across all
      # packages) never runs during install/commit/sync — wasted time, and a type
      # nit there could block the dev sync. We don't need it; types are handled.
      HUSKY: "0"

    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate final personalize patch
        shell: bash
        run: |
          set -euo pipefail

          PATCH="patches/FinalPERSONALIZE.patch"

          if [ ! -f "$PATCH" ]; then
            echo "ERROR: Missing patch:"
            echo "  $PATCH"
            exit 1
          fi

          echo "Using patch:"
          echo "  $PATCH"

          if ! grep -qE '^(diff --git|--- |\+\+\+ )' "$PATCH"; then
            echo "ERROR: Patch does not look like a git/unified diff:"
            echo "  $PATCH"
            exit 1
          fi

          echo "Checking patch for literal conflict markers..."
          if grep -nE '^(<<<<<<<|=======|>>>>>>>)' "$PATCH"; then
            echo "ERROR: conflict markers exist inside patch:"
            echo "  $PATCH"
            exit 1
          fi

          echo "Checking patch does not patch automation/self/state files..."
          if grep -nE '^diff --git a/(patches/|\.github/opencode-build-state/|\.github/workflows/weekly_customautorel\.yml)' "$PATCH"; then
            echo "ERROR: FinalPERSONALIZE.patch must not patch automation/self/state files."
            echo "These files are copied into the final dev branch after build."
            exit 1
          fi

          echo "Patch validation OK."

      - name: Personalize isolation checks (hook budget, owned modules, shims)
        # Hard gate: the patch set must keep the isolation contract (max 4 upstream
        # hook hunks, only packages/cli/script/build.ts; everything else owned files)
        # BEFORE any clone/build work is spent. Patches are self-contained; this step
        # needs only the committed checker, its test, and patches/ on disk.
        shell: bash
        run: |
          set -euo pipefail

          echo "Running checker unit tests..."
          node --test .github/scripts/personalize-hooks.test.cjs
          node --test .github/scripts/personalize-workflow.test.cjs
          node --experimental-vm-modules --test .github/scripts/personalize-runtime.test.cjs
          node --test .github/scripts/repair-photon-patch.test.cjs

          echo "Checking patch-set isolation contract..."
          node .github/scripts/check-personalize-hooks.cjs

      - name: Load last successful upstream ref
        id: load_state
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "$STATE_BRANCH" || true

          LAST_SUCCESS=""

          if git show "origin/$STATE_BRANCH:$STATE_FILE_DIR/last-success-upstream.txt" >/tmp/last-success-upstream.txt 2>/dev/null; then
            LAST_SUCCESS="$(cat /tmp/last-success-upstream.txt | tr -d '[:space:]')"
          fi

          echo "last_success=$LAST_SUCCESS" >> "$GITHUB_OUTPUT"
          echo "Last successful upstream ref from $STATE_BRANCH: ${LAST_SUCCESS:-<none>}"

      - name: Resolve upstream Bun version
        id: bunver
        shell: bash
        run: |
          set -euo pipefail

          rm -rf upstream-meta
          git clone --no-checkout "$UPSTREAM_REPO" upstream-meta

          cd upstream-meta
          git fetch origin "$UPSTREAM_REF" --depth=1
          git checkout --detach FETCH_HEAD

          BUN_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"

          echo "bun_version=$BUN_VERSION" >> "$GITHUB_OUTPUT"
          echo "Using upstream Bun version: $BUN_VERSION"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bunver.outputs.bun_version }}

      - name: Build latest upstream or fallback
        id: build
        shell: bash
        run: |
          set -euo pipefail

          final_patch_file() {
            echo "../patches/FinalPERSONALIZE.patch"
          }

          auto_resolve_git_apply_conflict_take_patch_side() {
            echo "Auto-resolving git-apply conflicts by taking PATCH side (--theirs)."

            CONFLICT_FILES="$(git diff --name-only --diff-filter=U || true)"

            if [ -z "$CONFLICT_FILES" ]; then
              echo "No conflicted files found."
              return 1
            fi

            echo "Conflicted files:"
            echo "$CONFLICT_FILES"

            while IFS= read -r f; do
              [ -z "$f" ] && continue

              echo ""
              echo "Resolving conflict by taking patch side:"
              echo "  $f"

              echo "Index stages:"
              git ls-files -u -- "$f" || true

              if git ls-files -u -- "$f" | awk '$3 == "3" { found=1 } END { exit found ? 0 : 1 }'; then
                echo "Patch side exists. Taking --theirs:"
                git checkout --theirs -- "$f"
                git add -- "$f"
              else
                echo "Patch side has no stage-3 version. Treating as patch-side delete:"
                git rm -f -- "$f"
              fi
            done <<< "$CONFLICT_FILES"

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "ERROR: Unmerged files remain after auto-resolve:"
              git diff --name-only --diff-filter=U
              return 1
            fi

            return 0
          }

          apply_custom_git_patches() {
            PATCH="$(final_patch_file)"

            echo ""
            echo "Applying final personalize patch:"
            echo "  $PATCH"

            if [ ! -f "$PATCH" ]; then
              echo "ERROR: Missing patch:"
              echo "  $PATCH"
              return 20
            fi

            if git apply --3way --index --whitespace=fix "$PATCH"; then
              echo "Patch applied cleanly:"
              echo "  $PATCH"
            else
              echo "Patch conflicted or failed:"
              echo "  $PATCH"

              git status --short || true

              echo ""
              echo "Conflict markers before auto-resolve:"
              git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- . || true

              if auto_resolve_git_apply_conflict_take_patch_side; then
                echo "Auto-resolved by taking patch side."
              else
                echo "ERROR: auto-resolve failed for:"
                echo "  $PATCH"
                git status --short || true
                return 20
              fi
            fi

            echo ""
            echo "Checking for remaining unmerged index entries..."
            if git ls-files -u | grep -q .; then
              echo "ERROR: unmerged index entries remain:"
              git ls-files -u
              return 21
            fi

            echo ""
            echo "Checking for conflict markers after patch apply..."
            if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- .; then
              echo "ERROR: conflict markers remain after auto-resolve"
              return 22
            fi

            echo ""
            echo "Patch status:"
            git status --short

            if git diff --cached --quiet; then
              echo "ERROR: final patch produced no staged changes"
              return 23
            fi

            git commit -m "ApplyFinalPERSONALIZEpatch"

            echo "Applied final personalize patch."

            # Optional transparency patch (best-effort): apply if it fits, else skip.
            # Apply failures are optional; an applied stack must pass tests/build.
            # Release notes flag skipped FinalPersonalizeX.patch applications.
            APPLIED_TRANSPARENCY="off"
            XPATCH="../patches/FinalPersonalizeX.patch"
            if [ -f "$XPATCH" ]; then
              echo "Attempting optional patch: $XPATCH"
              if git apply --3way --index --whitespace=fix "$XPATCH" && ! git ls-files -u | grep -q .; then
                git commit -m "ApplyFinalPersonalizeX(transparency)"
                APPLIED_TRANSPARENCY="on"
                echo "Optional transparency patch applied."
              else
                echo "Optional transparency patch did NOT apply; skipping (build continues without it)."
                git reset --hard HEAD >/dev/null 2>&1 || true
              fi
            else
              echo "No optional transparency patch present."
            fi

            # Optional OpenScience research-agents patch (best-effort): apply if it fits, else skip.
            # Independent of transparency; apply failures are flagged in release notes.
            # An applied stack must still pass the combined tests/build.
            APPLIED_SCIENCE="off"
            SPATCH="../patches/FinalPersonalizeS.patch"
            if [ -f "$SPATCH" ]; then
              echo "Attempting optional patch: $SPATCH"
              if git apply --3way --index --whitespace=fix "$SPATCH" && ! git ls-files -u | grep -q .; then
                git commit -m "ApplyFinalPersonalizeS(research-agents)"
                APPLIED_SCIENCE="on"
                echo "Optional research-agents patch applied."
              else
                echo "Optional research-agents patch did NOT apply; skipping (build continues without it)."
                git reset --hard HEAD >/dev/null 2>&1 || true
              fi
            else
              echo "No optional research-agents patch present."
            fi

            # Optional RSI /distill loop patch (best-effort): native distill_session tool +
            # built-in /distill command, compiled into the binary. Apply failures are optional.
            # This is the riskiest optional (hand-written effect code); a skip is flagged in the notes.
            APPLIED_RSI="off"
            RPATCH="../patches/FinalPersonalizeR.patch"
            if [ -f "$RPATCH" ]; then
              echo "Attempting optional patch: $RPATCH"
              if git apply --3way --index --whitespace=fix "$RPATCH" && ! git ls-files -u | grep -q .; then
                git commit -m "ApplyFinalPersonalizeR(rsi-distill-loop)"
                APPLIED_RSI="on"
                echo "Optional RSI loop patch applied."
              else
                echo "Optional RSI loop patch did NOT apply; skipping (build continues without it)."
                git reset --hard HEAD >/dev/null 2>&1 || true
              fi
            else
              echo "No optional RSI loop patch present."
            fi

            return 0
          }

          strip_upstream_workflows() {
            echo ""
            echo "Removing upstream .github/workflows (kept out of patch; can never block build)..."
            # opencode-src never contains our own automation workflow, so it is safe
            # to drop ALL upstream CI here. This guarantees:
            #   1. broken / secret-bound upstream workflows can never block the build, and
            #   2. they are not synced onto the dev branch where they would try to run.
            rm -rf .github/workflows
            echo "Upstream workflows removed."
            return 0
          }

          # Upstream's 2.x naming refactor renamed packages/opencode -> packages/cli
          # (and its dist dirs from opencode-<platform> -> cli-<platform>, and the
          # build flag --skip-embed-web-ui -> --skip-web-ui). Fallback builds can
          # still check out old 1.x refs, so BOTH layouts must keep working:
          # resolve everything per-checkout instead of hardcoding either one.
          locate_opencode_pkg() {
            if [ -f packages/opencode/package.json ]; then
              echo "packages/opencode"
            elif [ -f packages/cli/package.json ]; then
              echo "packages/cli"
            else
              return 1
            fi
          }

          dist_prefix_for() {
            # build.ts names each dist subdir "<target>" with the binary name replaced:
            # old tree -> "opencode-linux-x64", renamed tree -> "cli-linux-x64".
            case "$1" in
              packages/cli) echo "cli" ;;
              *) echo "opencode" ;;
            esac
          }

          resolve_opencode_version() {
            # The build stamps this string into the binary via --define OPENCODE_VERSION,
            # and the SAME string becomes the process user-agent: opencode/<version>.
            # packages/script/src/index.ts derives it like this:
            #   CHANNEL  = git branch --show-current      <-- EMPTY, try_build() checks out --detach
            #   PREVIEW  = CHANNEL !== "latest"           <-- therefore true
            #   VERSION  = 0.0.0-${CHANNEL}-<timestamp>   <-- therefore "0.0.0--<timestamp>"
            # 0.0.0 (and that empty prerelease field is not even valid semver) is why the
            # server answers "OpenCode 1.18.0 or newer is required to use the free tier".
            # Pin the real upstream version so the gate sees a true release number.
            #
            # NOTE: this runs under `set -euo pipefail`. Every read must survive an
            # UNSET variable (-u), and every command substitution must not abort the
            # job on a nonzero exit (-e / pipefail) -- the fallbacks below exist
            # precisely for the cases where a command fails, so they must be reached.
            local v="${OPENCODE_VERSION:-}"

            # 1) honour an explicit override, 2) else the upstream tree's own version
            if [ -z "$v" ]; then
              v="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
                     "$(locate_opencode_pkg 2>/dev/null || echo packages/opencode)/package.json" 2>/dev/null | head -1 || true)"
            fi

            # 3) last resort: whatever upstream actually published
            case "$v" in
              ''|0.0.0*)
                echo "package.json version unusable ('${v:-<empty>}'), asking npm..."
                v="$(curl -fsSL --max-time 20 https://registry.npmjs.org/opencode-ai/latest 2>/dev/null \
                     | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1 || true)"
                ;;
            esac

            # must be a real release number, and at or above the free-tier floor
            if [[ ! "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)([.-].*)?$ ]]; then
              echo "ERROR: could not resolve a real upstream version (got '${v:-<empty>}')"
              echo "Refusing to build: a 0.0.0 binary is locked out of the free tier."
              return 1
            fi
            local major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}"
            if [ "$major" -lt 1 ] || { [ "$major" -eq 1 ] && [ "$minor" -lt 18 ]; }; then
              echo "ERROR: resolved version $v is below the 1.18.0 free-tier floor"
              return 1
            fi

            # A non-"0.0.0-" OPENCODE_VERSION already makes index.ts pick channel "latest",
            # but set it explicitly so the build never depends on that inference.
            export OPENCODE_VERSION="$v"
            export OPENCODE_CHANNEL="latest"
            echo "Build version: OPENCODE_VERSION=$OPENCODE_VERSION OPENCODE_CHANNEL=$OPENCODE_CHANNEL"
            return 0
          }

          run_patch_tests() {
            # Unit tests shipped inside the patches (isolated architecture: owned
            # new files only -- stock modules are never modified). They pin:
            #  - context-decay reader (owned): archived turns may NEVER surface
            #    undefined content/system into compaction (TypeError: e.content.map),
            #  - content guards (owned): every .content array access in
            #    src/personalize/* stays Array.isArray-guarded,
            #  - upstream's own model-request hook suite (stock, unmodified):
            #    shim-level decoration is enforced at build time by
            #    check-personalize-hooks.cjs + the PersonalizeBuild plugin, not here.
            local tests=() f found
            local required=(
              packages/core/test/session-context-decay.test.ts
              packages/core/test/session/content-guards.test.ts
              packages/core/test/session-model-request-hooks.test.ts
            )
            # This test is owned by optional FinalPersonalizeR, not the core patch.
            # Require it when R is applied; do not require it after dropping R.
            if [ "${APPLIED_RSI:-off}" = "on" ]; then
              required+=(packages/core/test/personalize-legacy.test.ts)
            fi
            for f in "${required[@]}"; do
              if [ -f "$f" ]; then
                tests+=("$f")
              else
                # tolerate upstream layout renames -- the patch tracks them
                found="$(git ls-files "*/$(basename "$f")" | head -1 || true)"
                if [ -n "$found" ]; then
                  tests+=("$found")
                else
                  echo "ERROR: patched test file missing from tree: $(basename "$f")"
                  return 1
                fi
              fi
            done
            # upstream bunfig.toml pins the bun-test root away from the repo
            # root ("do-not-run-tests-from-root" guard), so `bun test` dies when
            # launched from the root even with explicit file args -- run from
            # the owning package directory with package-relative paths instead
            local pkgdir="${tests[0]%%/test/*}"
            [ "$pkgdir" = "${tests[0]}" ] && pkgdir="."
            local rel=() f2
            for f2 in "${tests[@]}"; do rel+=("${f2#"$pkgdir"/}"); done
            echo "Running patched unit tests (cwd $pkgdir): ${rel[*]}"
            if ! (cd "$pkgdir" && bun test "${rel[@]}"); then
              echo "ERROR: patched unit tests FAILED -- refusing to build this ref"
              return 1
            fi
            return 0
          }

          run_opencode_build() {
            if ! resolve_opencode_version; then
              return 1
            fi
            local pkg prefix flag
            if ! pkg="$(locate_opencode_pkg)"; then
              echo "ERROR: no CLI package found (neither packages/opencode nor packages/cli has a package.json)"
              return 1
            fi
            prefix="$(dist_prefix_for "$pkg")"
            flag="--skip-embed-web-ui"
            [ "$pkg" = "packages/cli" ] && flag="--skip-web-ui"
            echo "CLI package dir: $pkg (dist prefix: $prefix, web-ui flag: $flag)"
            # The build script may invoke bun install again; keep the same
            # temporary dependency repair around that invocation too.
            if ! node .personalize/repair-photon-patch.cjs --run . bun run --cwd "$pkg" build -- "$flag"; then
              echo "opencode build failed"
              return 1
            fi
            echo "Checking expected build outputs..."
            for d in \
              windows-x64 windows-x64-baseline \
              linux-x64 linux-x64-baseline linux-arm64 \
              darwin-x64 darwin-x64-baseline darwin-arm64; do
              if [ ! -d "$pkg/dist/$prefix-$d" ]; then
                echo "missing build output: $prefix-$d"
                return 1
              fi
            done

            # The whole point of this patch: prove the version actually landed in the
            # artifact. build.ts already runs `--version` as a smoke test, but it only
            # checks that the binary starts -- it never looks at the number.
            echo "Verifying the stamped version survived into the binary..."
            local bin
            bin="$(find "$pkg/dist/$prefix-linux-x64" -type f -name opencode \
                   -perm -u+x 2>/dev/null | head -1 || true)"
            if [ -z "$bin" ]; then
              echo "ERROR: could not locate the linux-x64 opencode binary to verify"
              return 1
            fi
            local reported
            reported="$("$bin" --version 2>&1 | tr -d '\r' || true)"
            if ! printf '%s' "$reported" | grep -qF "$OPENCODE_VERSION"; then
              echo "ERROR: binary reports '$reported', expected it to contain $OPENCODE_VERSION"
              echo "A 0.0.0 build is locked out of the free tier -- refusing to release it."
              return 1
            fi
            echo "Binary reports: $reported"
            return 0
          }

          try_build() {
            local ref="$1"
            local label="$2"

            echo ""
            echo "================================================="
            echo "TRY BUILD: $label"
            echo "REF: $ref"
            echo "================================================="

            rm -rf opencode-src
            git clone --no-checkout "$UPSTREAM_REPO" opencode-src

            cd opencode-src

            if ! git fetch origin "$ref"; then
              echo "ERROR: failed to fetch upstream ref: $ref"
              cd ..
              return 10
            fi

            if ! git checkout --detach FETCH_HEAD; then
              echo "ERROR: failed to checkout FETCH_HEAD"
              cd ..
              return 11
            fi

            UPSTREAM_SHA="$(git rev-parse HEAD)"
            echo "Checked out upstream SHA: $UPSTREAM_SHA"

            # Isolation contract against the LIVE upstream: manifest-declared exports
            # and every stock.X access must still resolve on this exact tree. Latest
            # attempt only -- the fallback SHA predates refactors and is already
            # guarded by the 3-way apply plus the shipped unit tests.
            if [ "$label" = "latest" ]; then
              echo "Checking personalization isolation against pristine upstream..."
              if ! node ../.github/scripts/check-personalize-hooks.cjs --patches ../patches --upstream .; then
                echo "ERROR: personalization isolation check failed"
                cd ..
                return 12
              fi
            fi

            git config user.name "claudedbuildbot"
            git config user.email "claudedbuildbot@example.local"

            strip_upstream_workflows

            if ! apply_custom_git_patches; then
              echo "ERROR: custom patch application failed"
              cd ..
              return 20
            fi

            echo "Final conflict marker check before build..."
            if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- .; then
              echo "ERROR: unresolved conflict markers before build"
              cd ..
              return 23
            fi

            echo "Patched commits:"
            git log --oneline -12

            # Repair the known photon hunk only during install; the helper
            # restores the upstream patch byte-for-byte even if install fails.
            if ! node .personalize/repair-photon-patch.cjs --run . bun install; then
              echo "ERROR: bun install failed"
              cd ..
              return 30
            fi

            if ! { run_patch_tests && run_opencode_build; }; then
              # A combined test/build failure does not identify a broken optional
              # patch. Reject this ref; never erase unrelated features to pass.
              echo "ERROR: patched tests/build failed (transparency=${APPLIED_TRANSPARENCY:-off}, science=${APPLIED_SCIENCE:-off}, rsi=${APPLIED_RSI:-off})."
              cd ..
              return 40
            fi

            cd ..

            echo "built_ref=$ref" >> "$GITHUB_OUTPUT"
            echo "built_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
            echo "built_label=$label" >> "$GITHUB_OUTPUT"
            echo "transparency=${APPLIED_TRANSPARENCY:-off}" >> "$GITHUB_OUTPUT"
            echo "science=${APPLIED_SCIENCE:-off}" >> "$GITHUB_OUTPUT"
            echo "rsi=${APPLIED_RSI:-off}" >> "$GITHUB_OUTPUT"

            return 0
          }

          LATEST_REF="$UPSTREAM_REF"
          LAST_SUCCESS="${{ steps.load_state.outputs.last_success }}"

          if try_build "$LATEST_REF" "latest"; then
            echo "Latest upstream build succeeded."
            exit 0
          fi

          echo ""
          echo "Latest upstream build FAILED."

          if [ -z "$LAST_SUCCESS" ]; then
            echo "No last successful upstream ref exists. Cannot fallback."
            exit 1
          fi

          echo "Falling back to last successful upstream ref: $LAST_SUCCESS"

          if try_build "$LAST_SUCCESS" "fallback-last-success"; then
            echo "Fallback build succeeded."
            exit 0
          fi

          echo "Fallback build also failed. Manual patch maintenance required."
          exit 1

      - name: Package CLI artifacts
        id: package
        shell: bash
        run: |
          set -euo pipefail

          # Old upstream layout vs post-rename layout (packages/opencode -> packages/cli,
          # dist subdirs opencode-<plat> -> cli-<plat>). Release ASSET names stay the same.
          DIST="opencode-src/packages/opencode/dist"
          PREFIX="opencode"
          if [ ! -d "$DIST" ]; then
            DIST="opencode-src/packages/cli/dist"
            PREFIX="cli"
          fi
          echo "DIST=$DIST (prefix: $PREFIX)"
          OUT="$PWD/out"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          package_zip() {
            local src="$1"
            local name="$2"
            echo "Packaging zip: $name"
            (cd "$src/bin" && zip -9 -r "$OUT/$name.zip" .)
          }

          package_tar() {
            local src="$1"
            local name="$2"
            echo "Packaging tar.gz: $name"
            tar -czf "$OUT/$name.tar.gz" -C "$src/bin" .
          }

          package_zip "$DIST/$PREFIX-windows-x64" "opencode-windows-x64-custom"
          package_zip "$DIST/$PREFIX-windows-x64-baseline" "opencode-windows-x64-baseline-custom"

          package_tar "$DIST/$PREFIX-linux-x64" "opencode-linux-x64-custom"
          package_tar "$DIST/$PREFIX-linux-x64-baseline" "opencode-linux-x64-baseline-custom"
          package_tar "$DIST/$PREFIX-linux-arm64" "opencode-linux-arm64-custom"

          package_zip "$DIST/$PREFIX-darwin-x64" "opencode-darwin-x64-custom"
          package_zip "$DIST/$PREFIX-darwin-x64-baseline" "opencode-darwin-x64-baseline-custom"
          package_zip "$DIST/$PREFIX-darwin-arm64" "opencode-darwin-arm64-custom"

          # Optional science-skills pack (best-effort; only for a 'latest' release; NEVER fails the build).
          # Skills are too many to compile into the binary, so they ship as a downloadable asset.
          SKILLS_PACK="off"
          if [ "${{ steps.build.outputs.built_label }}" = "latest" ]; then
            if bash patches/build-openscience-skills.sh "$OUT/openscience-skills.tar.gz"; then
              SKILLS_PACK="on"
              echo "science-skills pack built -> openscience-skills.tar.gz"
            else
              echo "science-skills pack build failed; skipping (best-effort, release continues)."
            fi
          fi
          echo "skills_pack=$SKILLS_PACK" >> "$GITHUB_OUTPUT"

          cd "$OUT"
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        id: release
        if: steps.build.outputs.built_label == 'latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BUILT_SHA="${{ steps.build.outputs.built_sha }}"
          SHORT_SHA="${BUILT_SHA:0:12}"
          TAG="patched-opencode-${SHORT_SHA}"
          WARN_SUFFIX=""
          if [ "${{ steps.build.outputs.transparency }}" != "on" ] || [ "${{ steps.build.outputs.science }}" != "on" ] || [ "${{ steps.build.outputs.rsi }}" != "on" ]; then
            WARN_SUFFIX=" -- !! OPTIONAL PATCH(ES) SKIPPED !!"
          fi
          TITLE="Patched OpenCode ${SHORT_SHA}${WARN_SUFFIX}"

          echo "Creating/updating release:"
          echo "  tag=$TAG"
          echo "  title=$TITLE"

          git config user.name "claudedbuildbot"
          git config user.email "claudedbuildbot@example.local"

          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag already exists: $TAG"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

          NOTES_FILE="release-notes.md"
          : > "$NOTES_FILE"

          # LOUD banner at the very top when any optional patch was skipped.
          # The build stays GREEN (optionals are best-effort) — this only screams in the notes.
          SKIPPED=()
          [ "${{ steps.build.outputs.transparency }}" != "on" ] && SKIPPED+=("FinalPersonalizeX.patch -- UI transparency toggle")
          [ "${{ steps.build.outputs.science }}" != "on" ] && SKIPPED+=("FinalPersonalizeS.patch -- research/biology/physics/ml agents")
          [ "${{ steps.build.outputs.rsi }}" != "on" ] && SKIPPED+=("FinalPersonalizeR.patch -- /schedule, /distill, /council (schedule_task, distill_session, council tools)")
          if [ "${#SKIPPED[@]}" -gt 0 ]; then
            {
              echo "# 🚨🚨🚨 OPTIONAL PATCH FAILURE 🚨🚨🚨"
              echo "# ⚠️ BUILT-IN FEATURES ARE MISSING FROM THIS BUILD ⚠️"
              echo ""
              echo "The following optional patch(es) did NOT apply to this upstream and were **SKIPPED** — this binary shipped WITHOUT them:"
              echo ""
              for s in "${SKIPPED[@]}"; do echo "- **$s**"; done
              echo ""
              echo "Re-port the skipped patch(es) against the current upstream to restore these features. Per-patch details are below."
              echo ""
              echo "---"
              echo ""
            } >> "$NOTES_FILE"
          fi

          cat >> "$NOTES_FILE" <<EOF
          # Patched OpenCode Build

          Upstream commit:

          \`\`\`
          $BUILT_SHA
          \`\`\`

          Build label:

          \`\`\`
          ${{ steps.build.outputs.built_label }}
          \`\`\`

          Artifacts:

          - Windows x64
          - Windows x64 baseline
          - Linux x64
          - Linux x64 baseline
          - Linux arm64
          - macOS x64
          - macOS x64 baseline
          - macOS arm64

          SHA256 hashes are included in \`SHA256SUMS.txt\`.
          EOF

          if [ "${{ steps.build.outputs.transparency }}" != "on" ]; then
            {
              echo ""
              echo "> WARNING: the optional UI transparency patch (FinalPersonalizeX.patch) did NOT apply to this upstream and was skipped."
              echo "> This build has NO transparency toggle. Re-port FinalPersonalizeX.patch against current upstream when you want it back."
            } >> "$NOTES_FILE"
          fi

          if [ "${{ steps.build.outputs.science }}" != "on" ]; then
            {
              echo ""
              echo "> WARNING: the optional research-agents patch (FinalPersonalizeS.patch) did NOT apply to this upstream and was skipped."
              echo "> This build has NO research/biology/physics/ml agents. Re-port FinalPersonalizeS.patch against current upstream when you want them back."
            } >> "$NOTES_FILE"
          fi

          if [ "${{ steps.build.outputs.rsi }}" != "on" ]; then
            {
              echo ""
              echo "> WARNING: the optional FinalPersonalizeR.patch did NOT apply/build against this upstream and was skipped."
              echo "> This build has NO /schedule, /distill or /council commands (schedule_task, distill_session, council tools). Re-port FinalPersonalizeR.patch against current upstream when you want them back."
            } >> "$NOTES_FILE"
          fi

          if [ "${{ steps.package.outputs.skills_pack }}" = "on" ]; then
            ASSET="https://github.com/${{ github.repository }}/releases/download/$TAG/openscience-skills.tar.gz"
            {
              echo ""
              echo "## Science skills (~290, optional download)"
              echo ""
              echo "De-branded science skills (biology / chemistry / physics / ML / databases / ...), packaged as openscience-skills.tar.gz."
              echo "Install into opencode's global skill dir (~/.claude/skills), discovered via skills/**/SKILL.md:"
              echo ""
              echo '```bash'
              echo "mkdir -p ~/.claude/skills && curl -fsSL $ASSET | tar xz -C ~/.claude/skills"
              echo '```'
              echo '```powershell'
              echo "New-Item ~/.claude/skills -Type Directory -Force; iwr $ASSET -OutFile \$env:TEMP\\os.tgz; tar -xzf \$env:TEMP\\os.tgz -C ~/.claude/skills"
              echo '```'
            } >> "$NOTES_FILE"
          fi

          if [ "${{ steps.build.outputs.rsi }}" = "on" ]; then
            {
              echo ""
              echo "## Built-in tools from FinalPersonalizeR.patch (compiled into this binary)"
              echo ""
              echo "- **/distill** (distill_session): deterministic RSI — scores the session on the rubric and, if it clears >=75/100, saves a reusable skill to ~/.config/opencode/skills/learned/ (auto-discovered next session)."
              echo "- **/schedule** (schedule_task): deterministic qm-style background crons in a plain JSON store; \`export\` emits crontab/schtasks lines for unattended runs."
              echo "- **/council** (council): multi-model council — fans a question to several models directly and combines them by strategy (council/compare/debate/moa/router/consensus/arena). Configure models in ~/.config/opencode/council.json or per-project .opencode/council.json."
            } >> "$NOTES_FILE"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists; updating assets, title and notes."
            gh release upload "$TAG" out/*.zip out/*.tar.gz out/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            echo "Creating release."
            gh release create "$TAG" \
              out/*.zip \
              out/*.tar.gz \
              out/SHA256SUMS.txt \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE"
          fi

      # Releases are primary storage. A full quota must never block publishing.
      # Keep a short-lived download only for fallback builds / failed publishing.
      - name: Upload fallback CLI artifacts (best-effort, one day)
        if: ${{ always() && !cancelled() && steps.package.outcome == 'success' && steps.release.outcome != 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: oc-${{ steps.build.outputs.built_label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/*.zip
            out/*.tar.gz
            out/SHA256SUMS.txt
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Sync patched upstream source to dev
        id: sync
        if: steps.build.outputs.built_label == 'latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BUILT_SHA="${{ steps.build.outputs.built_sha }}"

          if [ -z "$BUILT_SHA" ]; then
            echo "ERROR: built_sha is empty"
            exit 1
          fi

          if [ ! -d "opencode-src/.git" ]; then
            echo "ERROR: opencode-src git repo missing"
            exit 1
          fi

          if [ ! -f "patches/FinalPERSONALIZE.patch" ]; then
            echo "ERROR: patches/FinalPERSONALIZE.patch missing from automation repo"
            exit 1
          fi

          echo "Syncing patched upstream source to branch:"
          echo "  $STATE_BRANCH"
          echo "Upstream SHA:"
          echo "  $BUILT_SHA"

          cd opencode-src

          git config user.name "claudedbuildbot"
          git config user.email "claudedbuildbot@example.local"

          mkdir -p "patches"
          mkdir -p "$STATE_FILE_DIR"

          cp "../patches/FinalPERSONALIZE.patch" "patches/FinalPERSONALIZE.patch"
          if [ -f "../patches/FinalPersonalizeX.patch" ]; then cp "../patches/FinalPersonalizeX.patch" "patches/FinalPersonalizeX.patch"; fi
          if [ -f "../patches/FinalPersonalizeS.patch" ]; then cp "../patches/FinalPersonalizeS.patch" "patches/FinalPersonalizeS.patch"; fi
          if [ -f "../patches/FinalPersonalizeR.patch" ]; then cp "../patches/FinalPersonalizeR.patch" "patches/FinalPersonalizeR.patch"; fi
          if [ -f "../patches/build-openscience-skills.sh" ]; then cp "../patches/build-openscience-skills.sh" "patches/build-openscience-skills.sh"; fi

          # GITHUB_TOKEN cannot CREATE or UPDATE a workflow file -- but an UNCHANGED
          # one is neither. Keep OUR workflow byte-identical to the copy already on
          # $STATE_BRANCH so the push carries no workflow diff, and drop upstream's
          # workflows (deletions are accepted). This is what keeps the weekly cron
          # alive: schedules fire only from the default branch = $STATE_BRANCH.
          SELF=".github/workflows/weekly_customautorel.yml"

          git rm -r -q --sparse --cached --ignore-unmatch .github/workflows
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp "../$SELF" "$SELF"

          # The workflow is also used from dev, so retain its tested cleanup helper.
          mkdir -p .github/scripts
          cp ../.github/scripts/cleanup-storage.cjs .github/scripts/cleanup-storage.cjs
          cp ../.github/scripts/cleanup-storage.test.cjs .github/scripts/cleanup-storage.test.cjs
          # Same for the isolation-contract validator: the dev tree carries the
          # patched sources it checks, so it stays runnable wherever the workflow runs.
          cp ../.github/scripts/check-personalize-hooks.cjs .github/scripts/check-personalize-hooks.cjs
          cp ../.github/scripts/personalize-hooks.test.cjs .github/scripts/personalize-hooks.test.cjs
          cp ../.github/scripts/personalize-workflow.test.cjs .github/scripts/personalize-workflow.test.cjs
          cp ../.github/scripts/personalize-runtime.test.cjs .github/scripts/personalize-runtime.test.cjs
          cp ../.github/scripts/repair-photon-patch.cjs .github/scripts/repair-photon-patch.cjs
          cp ../.github/scripts/repair-photon-patch.test.cjs .github/scripts/repair-photon-patch.test.cjs

          if [ ! -s "$SELF" ]; then
            echo "ERROR: $SELF missing from automation checkout; refusing to push"
            echo "(pushing without it deletes the workflow and kills the weekly cron)"
            exit 1
          fi

          echo "$BUILT_SHA" > "$STATE_FILE_DIR/last-success-upstream.txt"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > "$STATE_FILE_DIR/last-success-time.txt"

          echo "Final branch content status before commit:"
          git status --short

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit in patched source tree."
          else
            git commit -m "sync:upstream $BUILT_SHA +personalizepatch[skip ci]"
          fi

          TARGET_REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git remote remove target 2>/dev/null || true
          git remote add target "$TARGET_REPO"

          echo "Force pushing patched source tree to:"
          echo "  $STATE_BRANCH"

          git push --force target "HEAD:$STATE_BRANCH"

      - name: Prune old Releases only after a current upstream build and dev sync
        if: ${{ success() && needs.cleanup_artifacts.result == 'success' && steps.build.outputs.built_label == 'latest' && steps.release.outcome == 'success' && steps.sync.outcome == 'success' }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          BUILT_SHA: ${{ steps.build.outputs.built_sha }}
          BUILT_LABEL: ${{ steps.build.outputs.built_label }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        with:
          script: |
            const { cleanupReleases } = require('./.github/scripts/cleanup-storage.cjs');
            await cleanupReleases({
              github, context, core,
              builtSha: process.env.BUILT_SHA,
              builtLabel: process.env.BUILT_LABEL,
              releaseOutcome: process.env.RELEASE_OUTCOME,
              syncOutcome: process.env.SYNC_OUTCOME,
              upstreamRef: process.env.UPSTREAM_REF,
            });
